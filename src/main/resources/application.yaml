server:
  port: 8081

spring:
  application:
    name: qv-ms-plans

  datasource:
    url: jdbc:mysql://localhost:3306/plans_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Eilyn20117_
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        service-name: qv-ms-planes
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

